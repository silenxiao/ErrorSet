services:
  backend:
    build: ./backend
    container_name: errorset-backend
    restart: unless-stopped
    env_file: .env
    environment:
      # 数据统一落在挂载目录 /data（宿主机 ./data），覆盖 .env 中的相对路径
      DATABASE_URL: sqlite:////data/app.db
      DATA_DIR: /data
    volumes:
      - ./data:/data
    networks:
      production:
        ipv4_address: ${PROXY_NETWORK_PREFIX:-172.30.86}.2
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/docs', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    # 调试时如需从宿主机直连后端，取消下面注释
    # ports:
    #   - "127.0.0.1:8000:8000"

  web:
    build: ./frontend
    container_name: errorset-web
    restart: unless-stopped
    ports:
      # 默认直接占宿主 80；HTTPS 域名模式（setup_server.sh --with-domain）会在 .env
      # 写入 WEB_PUBLISH=127.0.0.1:8080:80，把 80/443 让给宿主机 nginx
      - "${WEB_PUBLISH:-80:80}"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      production:
        ipv4_address: ${PROXY_NETWORK_PREFIX:-172.30.86}.3

  admin:
    build: ./admin
    container_name: errorset-admin
    restart: unless-stopped
    ports:
      - "${ADMIN_PUBLISH:-8081:80}"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      production:
        ipv4_address: ${PROXY_NETWORK_PREFIX:-172.30.86}.4

networks:
  production:
    ipam:
      config:
        - subnet: ${PROXY_NETWORK_PREFIX:-172.30.86}.0/24
          gateway: ${PROXY_NETWORK_PREFIX:-172.30.86}.1
